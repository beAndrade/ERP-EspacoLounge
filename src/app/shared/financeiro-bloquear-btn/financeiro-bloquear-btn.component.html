@if (variant === 'toolbar') {
  <button
    type="button"
    class="list-head__toolbar-btn fin-bloquear-btn"
    (click)="bloquear($event)"
    aria-label="Bloquear acesso ao financeiro"
    title="Bloquear acesso"
  >
    <svg
      class="list-icon-sm"
      xmlns="http://www.w3.org/2000/svg"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </svg>
    <span class="list-head__toolbar-label">Bloquear</span>
  </button>
} @else {
  <button
    type="button"
    class="nav-item nav-item--sub fin-bloquear-btn fin-bloquear-btn--sidebar"
    (click)="bloquear($event)"
    aria-label="Bloquear acesso ao financeiro"
    title="Bloquear acesso"
  >
    <svg
      class="nav-item__icon"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </svg>
    <span class="nav-item__label">Bloquear acesso</span>
  </button>
}
