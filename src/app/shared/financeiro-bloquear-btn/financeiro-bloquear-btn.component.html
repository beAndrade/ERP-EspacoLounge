<span class="fin-bloquear-title">
  <span class="fin-bloquear-title__divider" aria-hidden="true"></span>
  <button
    type="button"
    class="fin-bloquear-title__btn"
    (click)="bloquear($event)"
    aria-label="Bloquear acesso ao financeiro"
    title="Bloquear acesso ao financeiro"
  >
    <svg
      class="fin-bloquear-title__icon"
      xmlns="http://www.w3.org/2000/svg"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        class="fin-bloquear-title__shackle-left"
        d="M7 11V7"
        stroke-linecap="butt"
      />
      <g class="fin-bloquear-title__shackle-swing">
        <path
          class="fin-bloquear-title__shackle-arch"
          d="M7 7a5 5 0 0 1 10 0"
          stroke-linecap="butt"
        />
        <path
          class="fin-bloquear-title__shackle-right"
          d="M17 7v4"
          stroke-linecap="butt"
        />
      </g>
      <rect
        class="fin-bloquear-title__body"
        width="18"
        height="11"
        x="3"
        y="11"
        rx="2"
        ry="2"
        stroke-linecap="round"
      />
    </svg>
    <span class="fin-bloquear-title__label">Bloquear</span>
  </button>
</span>
