<span
  class="cliente-avatar"
  [class.cliente-avatar--lista]="variant === 'lista'"
  [class.cliente-avatar--tip]="variant === 'tip'"
  [class.cliente-avatar--cabecalho]="variant === 'cabecalho'"
  [class.cliente-avatar--perfil]="variant === 'perfil'"
  [class.cliente-avatar--sidebar]="variant === 'sidebar'"
  [class.cliente-avatar--com-foto]="!!foto && !placeholderVazio"
  [class.cliente-avatar--vazio]="placeholderVazio"
  aria-hidden="true"
>
  @if (placeholderVazio) {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="cliente-avatar__ico cliente-avatar__ico--sidebar-empty"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
      />
    </svg>
  } @else if (foto) {
    <img [src]="foto" alt="" />
  } @else {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="cliente-avatar__ico lucide-user-round"
    >
      <circle cx="12" cy="8" r="5" />
      <path d="M20 21a8 8 0 0 0-16 0" />
    </svg>
  }
</span>
