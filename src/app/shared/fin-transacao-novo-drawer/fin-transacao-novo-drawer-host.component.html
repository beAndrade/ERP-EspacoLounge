@if (d.aberto) {
  <div
    class="overlay overlay--fin-novo"
    [class.overlay--open]="d.panelOpen"
    aria-hidden="true"
    (click)="d.fechar()"
  ></div>
  <div
    class="fin-novo-global-drawer app-drawer"
    [class.app-drawer--open]="d.panelOpen"
    [class.fin-novo-global-drawer--receita]="d.tipo === 'receita'"
    [class.fin-novo-global-drawer--despesa]="d.tipo === 'despesa'"
    [class.fin-novo-global-drawer--vale]="d.tipo === 'vale'"
    [class.fin-novo-global-drawer--transferencia]="d.tipo === 'transferencia'"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="d.ariaLabel"
    (click)="$event.stopPropagation()"
  >
    @if (d.isTransferencia) {
      <div class="fin-novo-transfer-stub">
        <header class="fin-novo-transfer-stub__head">
          <h1 class="fin-novo-transfer-stub__title">Nova transferência</h1>
          <button
            type="button"
            class="fin-novo-transfer-stub__close"
            (click)="d.fechar()"
            aria-label="Fechar"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <p class="fin-novo-transfer-stub__text">
          A transferência entre contas ainda será implementada. Em breve você
          poderá registrar movimentos entre Caixa e Banco por aqui.
        </p>
        <button
          type="button"
          class="fin-novo-transfer-stub__btn"
          (click)="d.fechar()"
        >
          Voltar
        </button>
      </div>
    } @else {
      <app-fin-transacao-novo-drawer
        [aberto]="d.aberto"
        [tipo]="d.tipoFormulario"
        [salvando]="d.salvando"
        (fechar)="d.fechar()"
        (confirmar)="d.confirmar($event)"
      />
    }
  </div>
}
