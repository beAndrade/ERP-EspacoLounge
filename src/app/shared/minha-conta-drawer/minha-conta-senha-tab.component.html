<main class="cliente-main minha-conta-tab">
  <div class="minha-conta-atencao" role="note">
    <strong>Atenção:</strong>
    Ao alterar a senha, você será deslogado de todos os aparelhos. Será
    necessário fazer login novamente com a nova senha.
  </div>

  <label class="minha-conta-field">
    <span class="minha-conta-field__label"
      ><span class="minha-conta-req" aria-hidden="true">*</span> Senha atual</span
    >
    <div class="minha-conta-field__senha">
      <input
        class="minha-conta-field__input"
        [type]="d.mostrarSenhaAtual ? 'text' : 'password'"
        [(ngModel)]="d.senhaAtual"
        name="contaSenhaAtual"
        autocomplete="current-password"
        [disabled]="d.salvando"
      />
      <button
        type="button"
        class="minha-conta-field__toggle"
        (click)="d.mostrarSenhaAtual = !d.mostrarSenhaAtual"
      >
        @if (d.mostrarSenhaAtual) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        }
      </button>
    </div>
  </label>

  <label class="minha-conta-field">
    <span class="minha-conta-field__label"
      ><span class="minha-conta-req" aria-hidden="true">*</span> Nova senha</span
    >
    <div class="minha-conta-field__senha">
      <input
        class="minha-conta-field__input"
        [type]="d.mostrarSenhaNova ? 'text' : 'password'"
        [(ngModel)]="d.senhaNova"
        name="contaSenhaNova"
        autocomplete="new-password"
        [disabled]="d.salvando"
      />
      <button
        type="button"
        class="minha-conta-field__toggle"
        (click)="d.mostrarSenhaNova = !d.mostrarSenhaNova"
      >
        @if (d.mostrarSenhaNova) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        }
      </button>
    </div>
  </label>

  <label class="minha-conta-field">
    <span class="minha-conta-field__label"
      ><span class="minha-conta-req" aria-hidden="true">*</span> Repita a nova senha</span
    >
    <div class="minha-conta-field__senha">
      <input
        class="minha-conta-field__input"
        [type]="d.mostrarSenhaConfirmacao ? 'text' : 'password'"
        [(ngModel)]="d.senhaNovaConfirmacao"
        name="contaSenhaConfirm"
        autocomplete="new-password"
        [disabled]="d.salvando"
      />
      <button
        type="button"
        class="minha-conta-field__toggle"
        (click)="d.mostrarSenhaConfirmacao = !d.mostrarSenhaConfirmacao"
      >
        @if (d.mostrarSenhaConfirmacao) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        }
      </button>
    </div>
  </label>
</main>
