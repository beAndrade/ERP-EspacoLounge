@if (d.aberto) {
  <div
    class="overlay overlay--cliente"
    [class.overlay--open]="d.panelOpen"
    aria-hidden="true"
    (click)="d.fechar()"
  ></div>
  <div
    class="app-drawer cliente-drawer cliente-drawer--minha-conta"
    [class.app-drawer--open]="d.panelOpen"
    role="dialog"
    aria-modal="true"
    aria-label="Editando usuário"
    (click)="$event.stopPropagation()"
  >
    <div class="cliente-shell">
      <header class="cliente-head">
        <div class="cliente-head__title-wrap">
          <h2 class="cliente-head__title">Editando usuário</h2>
        </div>
        <button
          type="button"
          class="cliente-head__close"
          (click)="d.fechar()"
          aria-label="Fechar"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>
      <div class="cliente-body-scroll">
        <div class="cliente-body">
          <nav
            class="cliente-nav"
            aria-label="Secções da conta"
            [style.--cliente-nav-active-index]="d.abaAtivaIndex()"
          >
            <span class="cliente-nav__indicator" aria-hidden="true"></span>
            @for (aba of d.abas; track aba) {
              <button
                type="button"
                class="cliente-nav__item"
                [class.cliente-nav__item--active]="d.abaAtiva === aba"
                (click)="d.selecionarAba(aba)"
              >
                <span class="cliente-nav__label">{{ aba }}</span>
              </button>
            }
          </nav>
          @if (d.abaAtiva === 'Alterar e-mail') {
            <app-minha-conta-email-tab />
          } @else {
            <app-minha-conta-senha-tab />
          }
        </div>
      </div>
      <footer class="cliente-drawer-footer">
        @if (d.saveErro) {
          <p class="cliente-save-hint cliente-save-hint--error" role="alert">
            {{ d.saveErro }}
          </p>
        }
        <button
          type="button"
          class="cliente-footer-btn cliente-footer-btn--ghost"
          [disabled]="d.salvando"
          (click)="d.fechar()"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="cliente-footer-btn cliente-footer-btn--primary"
          [disabled]="d.salvando"
          (click)="d.salvar()"
        >
          {{ d.salvando ? 'Salvando…' : 'Salvar' }}
        </button>
      </footer>
    </div>
  </div>
}
