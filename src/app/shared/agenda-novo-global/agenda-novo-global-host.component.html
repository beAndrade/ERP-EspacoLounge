@if (d.aberto && d.contexto) {
  <div
    class="overlay overlay--agenda-novo-global"
    [class.overlay--open]="d.panelOpen"
    aria-hidden="true"
    (click)="d.fechar()"
  ></div>
  <div
    class="agenda-novo-global-drawer app-drawer"
    [class.app-drawer--open]="d.panelOpen"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="d.ariaLabel"
    (click)="$event.stopPropagation()"
  >
    <app-agenda-novo
      [modoModal]="true"
      [fluxoSomenteComanda]="d.fluxoSomenteComanda"
      [fluxoOrcamento]="d.fluxoOrcamento"
      [contextoSlot]="d.contexto"
      (salvoComSucesso)="d.onSalvo()"
      (cancelarModal)="d.fechar()"
      (abrirCadastroCliente)="onAbrirCadastroCliente($event)"
      (abrirNovoClienteDrawer)="abrirClienteNovo()"
      (imprimirOrcamento)="onImprimirOrcamento($event)"
      (enviarWhatsappOrcamento)="onWhatsappOrcamento($event)"
    />
  </div>
}

@if (previewDados) {
  <app-orcamento-preview-overlay
    [dados]="previewDados"
    (fechar)="fecharPreviewOrcamento()"
    (imprimir)="imprimirPreviewOrcamento()"
    (whatsapp)="whatsappPreviewOrcamento()"
  />
}

<app-whatsapp-enviar-modal
  [aberto]="whatsappAberto"
  [contexto]="whatsappCtx"
  (fechar)="fecharWhatsapp()"
  (enviado)="onWhatsappEnviado()"
/>
