<div class="cred-drawer">
  <div class="cred-body">
    <header class="cred-head">
      <h1 class="cred-title">Atualizar crédito</h1>
      <button
        type="button"
        class="cred-close"
        (click)="cancelar()"
        aria-label="Fechar"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    @if (erro) {
      <p class="cred-alert" role="alert">{{ erro }}</p>
    }

    <div class="cred-field">
      <label class="cred-field__label" for="cred-valor-input">
        <span class="cred-req" aria-hidden="true">*</span> Valor
      </label>
      <input
        id="cred-valor-input"
        type="text"
        class="cred-field__input"
        inputmode="numeric"
        [formControl]="valorCtrl"
        (input)="onValorMoedaInput($event)"
        (blur)="onValorBlur()"
        [attr.placeholder]="placeholderMoeda"
        aria-label="Valor"
      />
    </div>

    <div class="cred-field">
      <label class="cred-field__label" for="cred-mov-select">Movimentação</label>
      <select
        id="cred-mov-select"
        class="cred-field__select"
        [(ngModel)]="movimentacao"
        [ngModelOptions]="{ standalone: true }"
        [disabled]="salvando()"
        aria-label="Movimentação"
      >
        <option value="adicionar">Adicionar</option>
        <option value="retirar">Retirar</option>
      </select>
    </div>

    <div class="cred-switch-row">
      <div class="cred-switch-row__toggle">
        <span
          class="toggle toggle--liquid"
          role="switch"
          tabindex="0"
          [class.active]="gerarMovimentacaoFinanceira"
          [attr.aria-checked]="gerarMovimentacaoFinanceira"
          aria-label="Gerar movimentação financeira"
          (click)="toggleGerarMovimentacaoFinanceira()"
          (keydown)="onToggleFinKeydown($event)"
        ></span>
      </div>
      <span class="cred-switch-row__label">Gerar movimentação financeira</span>
    </div>

    <div class="cred-field cred-field--motivo">
      <label class="cred-field__label" for="cred-motivo-input">Motivo</label>
      <div class="cred-motivo-wrap">
        <textarea
          id="cred-motivo-input"
          class="cred-field__textarea"
          rows="4"
          [value]="motivo"
          [attr.maxlength]="motivoMax"
          [disabled]="salvando()"
          (input)="onMotivoInput($event)"
          aria-label="Motivo"
        ></textarea>
        <span class="cred-motivo-count" aria-live="polite">
          {{ motivo.length }} / {{ motivoMax }}
        </span>
      </div>
    </div>
  </div>

  <footer class="cred-footer">
    <button
      type="button"
      class="cred-btn cred-btn--ghost"
      (click)="cancelar()"
      [disabled]="salvando()"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="cred-btn cred-btn--primary"
      (click)="salvar()"
      [disabled]="salvando()"
    >
      {{ salvando() ? 'A guardar…' : 'Salvar' }}
    </button>
  </footer>
</div>
