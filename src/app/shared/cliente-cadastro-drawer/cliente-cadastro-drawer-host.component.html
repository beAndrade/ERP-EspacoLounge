@if (d.aberto) {
    <div
      class="overlay overlay--cliente"
      [class.overlay--open]="d.panelOpen"
      aria-hidden="true"
      (click)="d.fechar()"
    ></div>
    <div
      class="app-drawer cliente-drawer"
      [class.app-drawer--open]="d.panelOpen"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="d.ariaLabelDrawer()"
      (click)="$event.stopPropagation()"
    >
      <app-cliente-drawer-shell
        (abrirAtualizarCredito)="onAbrirAtualizarCreditoEmpilhado()"
      />
    </div>

    @if (d.comandaEmpilhadaAberta && d.comandaEmpilhadaContexto) {
      <div
        class="overlay overlay--cliente-comanda-empilhada"
        [class.overlay--open]="d.comandaEmpilhadaAberta"
        aria-hidden="true"
        (click)="fecharComandaEmpilhada()"
      ></div>
      <div
        class="app-drawer cliente-comanda-empilhada app-drawer--comanda"
        [class.app-drawer--open]="d.comandaEmpilhadaPanelOpen"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="ariaLabelComandaEmpilhada()"
        (click)="$event.stopPropagation()"
      >
        <app-nova-comanda-drawer
          [contexto]="d.comandaEmpilhadaContexto"
          (fechar)="fecharComandaEmpilhada()"
          (comandaExcluida)="onComandaEmpilhadaExcluida()"
          (comandaDataYmd)="onComandaEmpilhadaDataYmd($event)"
          (editarAgendamento)="onEditarAgendamentoDesdeComandaEmpilhada()"
          (salvarComanda)="onSalvarComandaEmpilhada()"
          (faturarComanda)="onAbrirFaturarComandaEmpilhada($event)"
          (abrirCadastroCliente)="
            onAbrirCadastroClienteDesdeComandaEmpilhada($event)
          "
        />
      </div>
    }

    @if (editAgendamentoEmpilhadoAberto && editAgendamentoEmpilhadoCtx) {
      <div
        class="overlay overlay--cliente-edit-ag-empilhada"
        [class.overlay--open]="editAgendamentoEmpilhadoPanelOpen"
        aria-hidden="true"
        (click)="fecharEditAgendamentoEmpilhado()"
      ></div>
      <div
        class="app-drawer cliente-edit-ag-empilhada app-drawer--edit-agendamento"
        [class.app-drawer--open]="editAgendamentoEmpilhadoPanelOpen"
        role="dialog"
        aria-modal="true"
        aria-label="Editar agendamento"
        (click)="$event.stopPropagation()"
      >
        <app-agenda-novo
          [modoModal]="true"
          [fluxoSomenteComanda]="true"
          [contextoSlot]="editAgendamentoEmpilhadoCtx"
          (salvoComSucesso)="onSalvoEditAgendamentoEmpilhado()"
          (cancelarModal)="fecharEditAgendamentoEmpilhado()"
          (abrirCadastroCliente)="
            onAbrirCadastroClienteDesdeComandaEmpilhada($event)
          "
        />
      </div>
    }

    @if (d.fichaEmpilhadaAberta) {
      <div
        class="overlay overlay--cliente-ficha-empilhada"
        [class.overlay--open]="d.fichaEmpilhadaPanelOpen"
        aria-hidden="true"
        (click)="fecharFichaEmpilhada()"
      ></div>
      <div
        class="app-drawer cliente-ficha-empilhada"
        [class.app-drawer--open]="d.fichaEmpilhadaPanelOpen"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="d.ariaLabelDrawer()"
        (click)="$event.stopPropagation()"
      >
        <app-cliente-drawer-shell
          [empilhada]="true"
          (fecharPainel)="fecharFichaEmpilhada()"
          (abrirAtualizarCredito)="onAbrirAtualizarCreditoEmpilhado()"
        />
      </div>
    }

    @if (atualizarCreditoAberto) {
      <div
        class="overlay overlay--cliente-credito-empilhada"
        [class.overlay--open]="atualizarCreditoPanelOpen"
        aria-hidden="true"
        (click)="fecharAtualizarCreditoEmpilhado()"
      ></div>
      <div
        class="app-drawer cliente-credito-empilhada"
        [class.app-drawer--open]="atualizarCreditoPanelOpen"
        role="dialog"
        aria-modal="true"
        aria-label="Atualizar crédito"
        (click)="$event.stopPropagation()"
      >
        <app-cliente-atualizar-credito-drawer
          [clienteId]="d.clienteId!"
          (salvo)="onAtualizarCreditoSalvo($event)"
          (fechar)="fecharAtualizarCreditoEmpilhado()"
        />
      </div>
    }

    @if (faturarEmpilhadoAberto && faturarEmpilhadoCtx) {
      <div
        class="overlay overlay--cliente-faturar-empilhada"
        [class.overlay--open]="faturarEmpilhadoPanelOpen"
        aria-hidden="true"
        (click)="fecharFaturarEmpilhado()"
      ></div>
      <div
        class="app-drawer cliente-faturar-empilhada app-drawer--faturar"
        [class.app-drawer--open]="faturarEmpilhadoPanelOpen"
        role="dialog"
        aria-modal="true"
        aria-label="Faturar comanda"
        (click)="$event.stopPropagation()"
      >
        <app-faturar-drawer
          [idAtendimento]="faturarEmpilhadoCtx.idAtendimento"
          [resumoInicial]="faturarEmpilhadoCtx.resumo"
          [creditoComandaAplicado]="faturarEmpilhadoCtx.creditoAUsar ?? 0"
          [dataComanda]="comandaEmpilhadaDataYmd"
          [modoVerPagamentos]="faturarEmpilhadoCtx.modoVerPagamentos ?? false"
          [gerenciarEscape]="false"
          (faturado)="onFaturaComandaEmpilhadaSucesso()"
          (fechar)="fecharFaturarEmpilhado()"
        />
      </div>
    }
  }
