@if (aberto()) {
  <div
    class="cliente-pagar-modal-overlay"
    role="presentation"
    (click)="onOverlayClick($event)"
  ></div>

  <div
    class="cliente-pagar-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cliente-pagar-modal-title"
    (click)="$event.stopPropagation()"
  >
    <h2 id="cliente-pagar-modal-title" class="cliente-pagar-modal__title">
      Pagar débitos
    </h2>

    @if (erroOpcoes()) {
      <p class="cliente-pagar-modal__alert" role="alert">{{ erroOpcoes() }}</p>
    }
    @if (erroForm) {
      <p class="cliente-pagar-modal__alert" role="alert">{{ erroForm }}</p>
    }

    <div class="cliente-pagar-modal__form">
      <label class="cliente-pagar-modal__field">
        <span class="cliente-pagar-modal__label"
          ><span class="cliente-pagar-modal__req" aria-hidden="true">*</span>Data</span
        >
        <span class="cliente-pagar-modal__date-wrap">
          <button
            type="button"
            class="cliente-pagar-modal__date-btn"
            [class.cliente-pagar-modal__date-btn--placeholder]="dataPlaceholder()"
            (click)="abrirCalendarioData($event, dataInput)"
            [disabled]="salvando() || carregandoOpcoes()"
          >
            <span class="cliente-pagar-modal__date-text">{{ rotuloData() }}</span>
            <span class="cliente-pagar-modal__date-ico" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                <path d="M16 2v4M8 2v4M3 10h18" />
              </svg>
            </span>
          </button>
          <input
            #dataInput
            type="date"
            class="cliente-pagar-modal__date-native"
            [value]="dataYmd"
            tabindex="-1"
            aria-hidden="true"
            (change)="onDataAlterada($event)"
          />
        </span>
      </label>

      <label class="cliente-pagar-modal__field">
        <span class="cliente-pagar-modal__label"
          ><span class="cliente-pagar-modal__req" aria-hidden="true">*</span>Forma de
          pagamento</span
        >
        <span class="cliente-pagar-modal__select-wrap">
          <select
            class="cliente-pagar-modal__select"
            [(ngModel)]="metodo"
            [disabled]="salvando() || carregandoOpcoes()"
            required
          >
            <option value="" disabled selected hidden>Forma de pagamento</option>
            @for (m of metodos(); track m.value) {
              <option [value]="m.value">{{ m.rotulo }}</option>
            }
          </select>
        </span>
      </label>

      <label class="cliente-pagar-modal__field">
        <span class="cliente-pagar-modal__label"
          ><span class="cliente-pagar-modal__req" aria-hidden="true">*</span>Conta</span
        >
        <span class="cliente-pagar-modal__select-wrap">
          <select
            class="cliente-pagar-modal__select"
            [(ngModel)]="conta"
            [disabled]="salvando() || carregandoOpcoes()"
            required
          >
            <option value="" disabled selected hidden>Conta</option>
            @for (c of contas; track c.value) {
              <option [value]="c.value">{{ c.rotulo }}</option>
            }
          </select>
        </span>
      </label>

      <label class="cliente-pagar-modal__field">
        <span class="cliente-pagar-modal__label"
          ><span class="cliente-pagar-modal__req" aria-hidden="true">*</span>Categoria</span
        >
        <span class="cliente-pagar-modal__select-wrap">
          <select
            class="cliente-pagar-modal__select"
            [(ngModel)]="categoriaId"
            [disabled]="
              salvando() || carregandoOpcoes() || categorias().length === 0
            "
            required
          >
            <option [ngValue]="null" disabled hidden>Categoria</option>
            @for (c of categorias(); track c.id) {
              <option [ngValue]="c.id">{{ c.nome }}</option>
            }
          </select>
        </span>
      </label>
    </div>

    <div class="cliente-pagar-modal__actions">
      <button
        type="button"
        class="cliente-pagar-modal__btn cliente-pagar-modal__btn--cancel"
        (click)="fecharModal()"
        [disabled]="salvando()"
      >
        Cancelar
      </button>
      <button
        type="button"
        class="cliente-pagar-modal__btn cliente-pagar-modal__btn--confirm"
        (click)="submeter()"
        [disabled]="salvando() || carregandoOpcoes()"
      >
        {{ salvando() ? 'A pagar…' : 'Pagar' }}
      </button>
    </div>
  </div>
}
