@if (aberto()) {
  <div
    class="wa-enviar-modal-overlay"
    role="presentation"
    (click)="onOverlayClick($event)"
  ></div>

  <div
    class="wa-enviar-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="wa-enviar-modal-title"
    (click)="$event.stopPropagation()"
  >
    <header class="wa-enviar-modal__head">
      <h2 id="wa-enviar-modal-title" class="wa-enviar-modal__title">
        Enviar WhatsApp
      </h2>
      <button
        type="button"
        class="wa-enviar-modal__close"
        aria-label="Fechar"
        (click)="fechar.emit()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    <p class="wa-enviar-modal__meta">
      Para: <strong>{{ contexto()?.clienteNome || 'Cliente' }}</strong>
      · {{ telefoneExibicao() }}
    </p>

    <div class="wa-enviar-modal__modo" role="radiogroup" aria-label="Modo de envio">
      <label class="wa-enviar-modal__radio">
        <input
          type="radio"
          name="waModo"
          value="template"
          [(ngModel)]="modo"
        />
        <span class="wa-enviar-modal__radio-dot" aria-hidden="true"></span>
        Template
      </label>
      <label class="wa-enviar-modal__radio">
        <input
          type="radio"
          name="waModo"
          value="manual"
          [(ngModel)]="modo"
        />
        <span class="wa-enviar-modal__radio-dot" aria-hidden="true"></span>
        Texto livre
      </label>
    </div>

    @if (modo === 'template') {
      <label class="wa-enviar-modal__field">
        <span>Template</span>
        <select [(ngModel)]="templateCodigo" name="templateCodigo">
          @for (tpl of templates(); track tpl.id) {
            <option [value]="tpl.codigo">{{ tpl.nome }}</option>
          }
        </select>
      </label>
    } @else {
      <label class="wa-enviar-modal__field">
        <span>Mensagem</span>
        <textarea
          [(ngModel)]="textoManual"
          name="textoManual"
          rows="5"
          placeholder="Escreva a mensagem…"
        ></textarea>
      </label>
    }

    <div class="wa-enviar-modal__preview">
      <span class="wa-enviar-modal__preview-label">Pré-visualização</span>
      <p>{{ preview() }}</p>
    </div>

    @if (erro()) {
      <p class="wa-enviar-modal__alert" role="alert">{{ erro() }}</p>
    }

    <footer class="wa-enviar-modal__foot">
      <button
        type="button"
        class="wa-enviar-modal__btn wa-enviar-modal__btn--ghost"
        (click)="fechar.emit()"
        [disabled]="enviando()"
      >
        Cancelar
      </button>
      <button
        type="button"
        class="wa-enviar-modal__btn wa-enviar-modal__btn--primary"
        (click)="confirmar()"
        [disabled]="enviando() || carregandoTemplates()"
      >
        {{ enviando() ? 'Enviando…' : 'Enviar' }}
      </button>
    </footer>
  </div>
}
