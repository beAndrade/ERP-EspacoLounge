<span
  #anchor
  class="painel-rich-tip"
  (mouseenter)="onEnter()"
  (mouseleave)="onLeave()"
  (focusin)="onEnter()"
  (focusout)="onLeave()"
>
  <button type="button" class="painel-rich-tip__btn" aria-label="Informação">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10" />
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
      <path d="M12 17h.01" />
    </svg>
  </button>
</span>

@if (mounted()) {
  <div
    #panel
    class="painel-rich-tip__panel"
    [class.painel-rich-tip__panel--visible]="visible()"
    role="tooltip"
    (mouseenter)="onPanelEnter()"
    (mouseleave)="onPanelLeave()"
  >
    <span class="painel-rich-tip__arrow" aria-hidden="true"></span>
    <div class="painel-rich-tip__body">
      <ng-content />
    </div>
  </div>
}
