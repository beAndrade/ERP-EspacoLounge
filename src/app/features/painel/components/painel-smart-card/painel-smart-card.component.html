<article
  class="painel-smart-card"
  [class.painel-smart-card--disabled]="disabled()"
  [class.painel-smart-card--link]="!!link() && !disabled()"
  [class.painel-smart-card--contexto]="contextoAtivo()"
  [attr.aria-label]="title()"
>
  @if (link() && !disabled()) {
    <a
      class="painel-smart-card__hit"
      [routerLink]="link()"
      tabindex="-1"
      aria-hidden="true"
    ></a>
  }

  <div class="painel-smart-card__main">
    <header class="painel-smart-card__head">
      <div class="painel-smart-card__titles">
        <h2 class="painel-smart-card__title">{{ title() }}</h2>
        @if (subtitle()) {
          <p class="painel-smart-card__subtitle">{{ subtitle() }}</p>
        }
        @if (contextoAtivo() && focoLabel()) {
          <span class="painel-smart-card__foco">Foco: {{ focoLabel() }}</span>
        }
      </div>
      <div class="painel-smart-card__icon" aria-hidden="true">
        <ng-content select="[painelCardIcon]" />
      </div>
    </header>

    <div class="painel-smart-card__value">
      <ng-content select="[painelCardValue]" />
    </div>

    <div class="painel-smart-card__spark">
      <ng-content select="[painelCardSpark]" />
    </div>
  </div>

  <div class="painel-smart-card__reveal" aria-live="polite">
    <div class="painel-smart-card__reveal-inner">
      <div class="painel-smart-card__reveal-body">
        <ng-content select="[painelCardReveal]" />
      </div>
      @if (ctaLabel() && ctaLink()) {
        <a
          class="painel-smart-card__cta"
          [routerLink]="ctaLink()"
          (click)="$event.stopPropagation()"
        >
          {{ ctaLabel() }}
          <span aria-hidden="true">→</span>
        </a>
      }
    </div>
  </div>
</article>
