<div
  class="painel-sparkline"
  [class.painel-sparkline--filled]="filled()"
  [style.--spark-color]="color()"
>
  @if (hasSeries()) {
    <svg
      class="painel-sparkline__svg"
      [attr.viewBox]="'0 0 ' + vbW + ' ' + vbH"
      overflow="visible"
      preserveAspectRatio="none"
      role="img"
      aria-label="Tendência no período"
      (mousemove)="onChartMove($event)"
      (mouseleave)="onChartLeave()"
    >
      @if (filled() && areaPath()) {
        <path class="painel-sparkline__area" [attr.d]="areaPath()" />
      }

      @if (linePath()) {
        <path
          class="painel-sparkline__curve"
          [attr.d]="linePath()"
          fill="none"
        />
      }

      @if (filled()) {
        <line
          class="painel-sparkline__axis"
          [attr.x1]="plotFirstX()"
          [attr.x2]="plotLastX()"
          [attr.y1]="baselineY()"
          [attr.y2]="baselineY()"
        />
        @for (p of plot(); track p.point.ymd + '-' + p.i) {
          <line
            class="painel-sparkline__tick"
            [attr.x1]="p.x"
            [attr.x2]="p.x"
            [attr.y1]="baselineY()"
            [attr.y2]="baselineY() + 3"
          />
        }
      }

      @if (activePoint(); as ap) {
        <line
          class="painel-sparkline__guide"
          [attr.x1]="ap.x"
          [attr.x2]="ap.x"
          [attr.y1]="hardTopY"
          [attr.y2]="baselineY()"
        />
        <ellipse
          class="painel-sparkline__dot"
          [attr.cx]="ap.x"
          [attr.cy]="ap.y"
          [attr.rx]="dotRadii().rx"
          [attr.ry]="dotRadii().ry"
        />
      }

      <rect
        class="painel-sparkline__hit-area"
        x="0"
        y="0"
        [attr.width]="vbW"
        [attr.height]="vbH"
        fill="transparent"
      />
    </svg>
  } @else {
    <div class="painel-sparkline__empty" aria-hidden="true">
      <svg
        class="painel-sparkline__svg"
        [attr.viewBox]="'0 0 ' + vbW + ' ' + vbH"
        overflow="visible"
        preserveAspectRatio="none"
      >
        <line
          class="painel-sparkline__baseline"
          [attr.x1]="padX"
          [attr.x2]="vbW - padX"
          [attr.y1]="vbH / 2"
          [attr.y2]="vbH / 2"
        />
      </svg>
    </div>
  }
</div>
