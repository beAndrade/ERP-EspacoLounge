@if (hasData()) {
  <div class="painel-status__donut" (mouseleave)="onLeave()">
    <svg viewBox="0 0 160 160" role="img" aria-label="Agendamentos por status">
      <circle
        class="painel-status__track"
        [attr.cx]="cx"
        [attr.cy]="cy"
        [attr.r]="(rOuter + rInner) / 2"
        fill="none"
        [attr.stroke-width]="rOuter - rInner"
      />
      @for (a of arcs(); track a.i) {
        <path
          class="painel-status__arc"
          [class.painel-status__arc--active]="activeIndex() === a.i"
          [attr.d]="a.d"
          [attr.fill]="a.color"
          fill-rule="evenodd"
          (mouseenter)="onEnter($event, a.i)"
          (mousemove)="onMove($event)"
          (mouseleave)="onLeave()"
        />
      }
      <text class="painel-status__center" [attr.x]="cx" [attr.y]="cy + 4" text-anchor="middle">
        Total: {{ total() }}
      </text>
    </svg>
  </div>

  <ul class="painel-status__legend">
    @for (item of legend(); track item.p.label) {
      <li class="painel-status__legend-item">
        <span class="painel-status__dot" [style.background]="item.cor"></span>
        <span class="painel-status__legend-name">{{ item.p.label }}</span>
        <span class="painel-status__legend-value">{{ item.p.value }} ({{ item.pct }}%)</span>
      </li>
    }
  </ul>
} @else {
  <p class="painel-status__empty">Sem agendamentos no período</p>
}
