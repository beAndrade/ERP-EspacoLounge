<div class="painel-chart painel-chart-funnel" (mouseleave)="onLeave()">
  @if (hasData()) {
    <div class="painel-chart-funnel__stack">
      @for (s of stages(); track s.i) {
        <button
          type="button"
          class="painel-chart-funnel__step"
          [class.painel-chart-funnel__step--active]="activeIndex() === s.i"
          [style.width.%]="s.widthPct"
          (mouseenter)="onEnter($event, s.i)"
          (mousemove)="onMove($event)"
        >
          <span class="painel-chart-funnel__label">{{ s.p.label }}</span>
          <strong>{{ s.p.value }}</strong>
        </button>
      }
    </div>
  } @else {
    <p class="painel-chart__empty">Sem dados no período</p>
  }
</div>
