<div class="painel-chart painel-chart-funnel" (mouseleave)="onLeave()">
  @if (hasData()) {
    <svg
      class="painel-chart-funnel__svg"
      [attr.viewBox]="'0 0 ' + vbW + ' ' + vbH"
      role="img"
      aria-label="Funil de agendamentos"
    >
      @for (s of stages(); track s.i) {
        <g class="painel-chart-funnel__stage">
          <path
            class="painel-chart-funnel__slice"
            [class.painel-chart-funnel__slice--active]="activeIndex() === s.i"
            [attr.d]="s.d"
            [attr.fill]="s.color"
            stroke="#fff"
            stroke-width="1"
            (mouseenter)="onEnter($event, s.i)"
            (mousemove)="onMove($event)"
          />
          <text
            class="painel-chart-funnel__label"
            [attr.x]="s.labelX"
            [attr.y]="s.labelY"
            text-anchor="middle"
            dominant-baseline="middle"
            pointer-events="none"
          >
            {{ s.display }}
          </text>
        </g>
      }
    </svg>
  } @else {
    <p class="painel-chart__empty">Sem dados no período</p>
  }
</div>
