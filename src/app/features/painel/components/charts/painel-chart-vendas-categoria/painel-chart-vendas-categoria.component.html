<div class="painel-vcat">
  @if (hasData()) {
    <div class="painel-vcat__donut">
      <svg
        width="190"
        height="190"
        viewBox="0 0 190 190"
        role="img"
        aria-label="Vendas por categoria"
      >
        <circle
          class="painel-vcat__track"
          [attr.cx]="cx"
          [attr.cy]="cy"
          [attr.r]="r"
          fill="none"
          [attr.stroke-width]="stroke"
        />
        <g [attr.transform]="'rotate(-90 ' + cx + ' ' + cy + ')'">
          @for (a of arcs(); track a.i) {
            <circle
              class="painel-vcat__arc"
              [attr.cx]="cx"
              [attr.cy]="cy"
              [attr.r]="r"
              fill="none"
              [attr.stroke]="a.color"
              [attr.stroke-width]="stroke"
              [attr.stroke-dasharray]="a.dash"
              [attr.stroke-dashoffset]="a.offset"
            />
          }
        </g>
      </svg>
      <span class="painel-vcat__center">Total: {{ formatMoeda(vm().total) }}</span>
    </div>

    <ul class="painel-vcat__legend">
      @for (l of vm().linhas; track l.label) {
        <li class="painel-vcat__legend-item">
          <span class="painel-vcat__dot" [style.background]="l.cor"></span>
          <span class="painel-vcat__legend-name">{{ l.label }}</span>
          <span class="painel-vcat__legend-value">
            {{ formatMoeda(l.valor) }} ({{ l.pct }}%)
          </span>
        </li>
      }
    </ul>
  } @else {
    <p class="painel-vcat__empty">Sem vendas no período</p>
  }
</div>
