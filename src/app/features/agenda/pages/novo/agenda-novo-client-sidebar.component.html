<div class="client-sidebar-drawer">
  <app-cliente-avatar
    variant="sidebar"
    [fotoUrl]="cliente?.fotoUrl"
    [placeholderVazio]="!temClienteSelecionado"
  />

  @if (!temClienteSelecionado) {
    <app-saas-select
      layout="sidebar"
      [bindToControl]="clienteIdControl"
      [options]="opcoesClientes"
      placeholder="Busque pelo cliente"
      [showFilter]="true"
      [showCriarCliente]="false"
    />
  } @else {
    <div class="client-sidebar-drawer__cliente-head">
      <button
        type="button"
        class="client-sidebar-drawer__nome-destaque client-sidebar-drawer__nome-btn"
        aria-label="Abrir perfil do cliente (em breve)"
      >
        {{ cliente?.nome?.trim() || '—' }}
      </button>
      <p class="client-sidebar-drawer__sub">{{ telefoneExibicao() }}</p>
      @if (mostrarBadgeClienteNovo) {
        <span
          class="client-sidebar-drawer__badge-novo-wrap"
          tabindex="0"
          aria-label="É um cliente sem agendamentos ou comandas, trate-o muito bem."
        >
          <span class="client-sidebar-drawer__badge-novo" aria-hidden="true">Novo</span>
          <span class="client-sidebar-drawer__badge-novo-tooltip" aria-hidden="true">
            <span class="client-sidebar-drawer__badge-novo-tooltip__line"
              >É um cliente sem agendamentos</span>
            <span class="client-sidebar-drawer__badge-novo-tooltip__line"
              >ou comandas, trate-o muito bem</span>
            <span class="client-sidebar-drawer__badge-novo-tooltip-emoji" aria-hidden="true">😁</span>
          </span>
        </span>
      }
    </div>
  }
</div>

@if (temClienteSelecionado) {
  <div class="client-sidebar-drawer__dados" aria-live="polite">
    <section
      class="sidebar-block sidebar-block--informacoes"
      aria-labelledby="sidebar-info-titulo"
    >
      <h3 class="sidebar-block__titulo sidebar-block__titulo--info" id="sidebar-info-titulo">
        Informações
      </h3>
      <ul class="sidebar-block__link-list" aria-label="Informações rápidas do cliente">
        <li>
          <button
            type="button"
            class="sidebar-block__linklike"
            (click)="clicouAbrirCadastroCliente()"
            [attr.aria-label]="ariaLabelBotaoAniversario()"
          >
            <span class="sidebar-block__link-ico" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-block__link-svg">
                <path d="M12 7v14"/>
                <path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/>
                <path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5"/>
                <rect x="3" y="7" width="18" height="4" rx="1"/>
              </svg>
            </span>
            <span class="sidebar-block__link-txt">{{ linhaAniversarioExibicao() }}</span>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="sidebar-block__linklike"
            (click)="clicouAbrirCadastroCliente({ aba: 'Cashback' })"
            [attr.aria-label]="linhaCashbackClienteExibicao() + '. Abrir histórico de cashback.'"
          >
            <span class="sidebar-block__link-ico" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-block__link-svg">
                <path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/>
                <path d="M18 12h.01"/>
                <path d="M19 22v-6"/>
                <path d="m22 19-3-3-3 3"/>
                <path d="M6 12h.01"/>
                <circle cx="12" cy="12" r="2"/>
              </svg>
            </span>
            <span class="sidebar-block__link-txt">{{ linhaCashbackClienteExibicao() }}</span>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="sidebar-block__linklike"
            (click)="clicouAbrirCadastroCliente({ aba: 'Créditos' })"
            [attr.aria-label]="linhaCreditoClienteExibicao() + '. Abrir histórico de crédito.'"
          >
            <span class="sidebar-block__link-ico" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-block__link-svg">
                <circle cx="12" cy="12" r="10"/>
                <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/>
                <path d="M12 18V6"/>
              </svg>
            </span>
            <span class="sidebar-block__link-txt">{{ linhaCreditoClienteExibicao() }}</span>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="sidebar-block__linklike"
            [class.sidebar-block__linklike--alert]="destacarComandasEmAberto()"
            (click)="clicouAbrirCadastroCliente({ aba: 'Débitos' })"
            [attr.aria-label]="textoComandasEmAberto() + '. Abrir débitos e comandas em aberto.'"
          >
            <span class="sidebar-block__link-ico" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="sidebar-block__link-svg"
              >
                <path d="M8 2v4" />
                <path d="M12 2v4" />
                <path d="M16 2v4" />
                <rect width="16" height="18" x="4" y="4" rx="2" />
                <path d="M8 10h6" />
                <path d="M8 14h8" />
                <path d="M8 18h5" />
              </svg>
            </span>
            <span
              class="sidebar-block__link-txt"
              [class.sidebar-block__link-txt--alert]="destacarComandasEmAberto()"
              >{{ textoComandasEmAberto() }}</span
            >
          </button>
        </li>
        <li>
          <button
            type="button"
            class="sidebar-block__linklike"
            [class.sidebar-block__linklike--alert]="destacarPagamentosEmAberto()"
            (click)="clicouAbrirCadastroCliente({ aba: 'Débitos' })"
            [attr.aria-label]="textoPagamentosEmAberto() + '. Abrir débitos em atraso.'"
          >
            <span class="sidebar-block__link-ico" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-block__link-svg">
                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>
                <path d="M12 9v4"/>
                <path d="M12 17h.01"/>
              </svg>
            </span>
            <span
              class="sidebar-block__link-txt"
              [class.sidebar-block__link-txt--alert]="destacarPagamentosEmAberto()"
              >{{ textoPagamentosEmAberto() }}</span
            >
          </button>
        </li>
      </ul>
    </section>

    <section class="sidebar-block" aria-labelledby="sidebar-pacotes-titulo">
      <h3 class="sidebar-block__titulo sidebar-block__titulo--info" id="sidebar-pacotes-titulo">Pacotes</h3>
      <p class="sidebar-block__placeholder">Não há pacotes disponíveis</p>
    </section>

    <section class="sidebar-block" aria-labelledby="sidebar-assinaturas-titulo">
      <h3 class="sidebar-block__titulo sidebar-block__titulo--info" id="sidebar-assinaturas-titulo">Assinaturas</h3>
      <p class="sidebar-block__placeholder">Não há assinaturas disponíveis</p>
    </section>
  </div>
}
