<div class="ahs" (click)="$event.stopPropagation()">
  <button
    type="button"
    class="ahs__trigger"
    #triggerBtn
    (mousedown)="onTriggerMouseDown($event)"
    (click)="toggle($event)"
    [disabled]="isDisabled"
    [attr.aria-label]="ariaFieldLabel || 'Horário inicial'"
    [attr.aria-expanded]="panelOpen"
    aria-haspopup="listbox"
  >
    @if (panelOpen) {
      <span class="ahs__value-row ahs__value-row--editing">
        <input
          #triggerInput
          type="search"
          class="ahs__trigger-input"
          [value]="filterText"
          (input)="onTriggerFilterInput($event)"
          (click)="$event.stopPropagation()"
          (keydown)="onTriggerFilterKeydown($event)"
          [placeholder]="displayLabel || '08:00'"
          autocomplete="off"
          [disabled]="isDisabled"
        />
      </span>
    } @else {
      <span
        class="ahs__value"
        [class.ahs__value--ph]="!displayLabel"
        >{{ displayLabel || "08:00" }}</span
      >
    }
    <span class="ahs__icons" aria-hidden="true">
      @if (panelOpen) {
        <svg
          class="ahs__icon ahs__icon--search"
          xmlns="http://www.w3.org/2000/svg"
          width="15"
          height="15"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m21 21-4.34-4.34" />
          <circle cx="11" cy="11" r="8" />
        </svg>
      } @else {
        <svg
          class="ahs__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
        </svg>
      }
    </span>
  </button>
  <div
    class="ahs__panel-elev"
    [class.ahs__panel-elev--open]="panelOpen"
    [attr.aria-hidden]="!panelOpen"
  >
    <div class="ahs__panel" role="listbox">
      <ul class="ahs__list">
        @for (o of opcoesFiltradas; track o.hhmm) {
          <li>
            <button
              type="button"
              class="ahs__opt"
              [class.ahs__opt--busy]="o.indisponivel"
              role="option"
              [tabindex]="panelOpen ? 0 : -1"
              (click)="escolher(o.hhmm, o.indisponivel, $event)"
            >
              <span class="ahs__t">{{ o.hhmm }}</span>
              @if (o.indisponivel) {
                <span class="ahs__busy">(Indisponível)</span>
              }
            </button>
          </li>
        }
      </ul>
    </div>
  </div>
</div>
