<div class="list-page wa-config-page">
  <header class="list-head wa-config-page__head">
    <div class="list-head__title-row">
      <div class="list-head__left">
        <h1 class="list-head__title">WhatsApp</h1>
        <p class="wa-config-page__sub">
          Integração multi-provedor — Evolution API ativa nesta versão.
        </p>
      </div>
    </div>
    <nav class="wa-config-page__tabs" aria-label="Secções WhatsApp">
      @for (tab of tabs; track tab.id) {
        <button
          type="button"
          class="wa-config-page__tab"
          [class.wa-config-page__tab--active]="tabAtiva() === tab.id"
          (click)="selecionarTab(tab.id)"
        >
          {{ tab.label }}
        </button>
      }
    </nav>
  </header>

  <div
    class="wa-config-page__body"
    [class.wa-config-page__body--wide]="tabAtiva() === 'historico'"
  >
    @if (tabAtiva() === 'integracao') {
      <app-whatsapp-config-tab />
    } @else if (tabAtiva() === 'templates') {
      <app-whatsapp-templates-tab />
    } @else {
      <app-whatsapp-logs-tab />
    }
  </div>
</div>
