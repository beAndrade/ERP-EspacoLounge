<div class="fin-edit-drawer">
  <div class="fin-edit-body">
    <header class="fin-edit-head">
      <h1 class="fin-edit-title">{{ titulo }}</h1>
      <button
        type="button"
        class="fin-edit-close"
        (click)="fechar.emit()"
        aria-label="Fechar"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    @if (erroOpcoes()) {
      <p class="fin-edit-alert" role="alert">{{ erroOpcoes() }}</p>
    }
    @if (erroForm) {
      <p class="fin-edit-alert" role="alert">{{ erroForm }}</p>
    }

    @if (linha()?.linhaReceita) {
      <label class="fin-edit-toggle-row">
        <span class="fin-edit-toggle-row__text">
          <span class="fin-edit-toggle-row__label"
            >É uma receita organizacional?</span
          >
          <span class="fin-edit-toggle-row__hint"
            >Se ativo, não vincula a nenhum caixa</span
          >
        </span>
        <button
          type="button"
          class="drawer-switch"
          [class.drawer-switch--on]="receitaOrganizacional"
          [attr.aria-pressed]="receitaOrganizacional"
          (click)="receitaOrganizacional = !receitaOrganizacional"
          [disabled]="salvando() || carregandoOpcoes()"
        ></button>
      </label>
    }

    <div class="fin-edit-grid fin-edit-grid--3">
      <label class="fin-edit-field">
        <span class="fin-edit-field__label">Valor bruto</span>
        <input
          type="text"
          class="fin-edit-field__input"
          inputmode="numeric"
          [value]="rotuloMoeda(valorBrutoDigitos)"
          (input)="onValorInput($event, 'bruto')"
          [disabled]="salvando() || carregandoOpcoes()"
        />
      </label>
      <label class="fin-edit-field">
        <span class="fin-edit-field__label">Taxas</span>
        <input
          type="text"
          class="fin-edit-field__input"
          inputmode="numeric"
          [value]="rotuloMoeda(taxasDigitos)"
          (input)="onValorInput($event, 'taxas')"
          [disabled]="salvando() || carregandoOpcoes()"
        />
      </label>
      <label class="fin-edit-field">
        <span class="fin-edit-field__label">Valor líquido</span>
        <input
          type="text"
          class="fin-edit-field__input fin-edit-field__input--readonly"
          [value]="rotuloValorLiquido()"
          readonly
          tabindex="-1"
        />
      </label>
    </div>

    <label class="fin-edit-field fin-edit-field--full">
      <span class="fin-edit-field__label">Descrição</span>
      <textarea
        class="fin-edit-field__textarea"
        rows="3"
        [(ngModel)]="descricao"
        [disabled]="salvando() || carregandoOpcoes()"
      ></textarea>
    </label>

    <div class="fin-edit-grid fin-edit-grid--3">
      <label class="fin-edit-field">
        <span class="fin-edit-field__label">Vencimento</span>
        <span class="fin-edit-date-wrap">
          <button
            type="button"
            class="fin-edit-date-btn"
            [class.fin-edit-date-btn--placeholder]="
              dataPlaceholder(dataVencimentoYmd)
            "
            (click)="abrirCalendarioData($event, vencInput)"
            [disabled]="salvando() || carregandoOpcoes()"
          >
            {{ rotuloData(dataVencimentoYmd) }}
          </button>
          <input
            #vencInput
            type="date"
            class="fin-edit-date-native"
            [value]="dataVencimentoYmd"
            tabindex="-1"
            aria-hidden="true"
            (change)="onDataAlterada($event, 'venc')"
          />
        </span>
      </label>
      <label class="fin-edit-field">
        <span class="fin-edit-field__label">Forma de pagamento</span>
        <select
          class="fin-edit-field__select"
          [(ngModel)]="metodoPagamento"
          (ngModelChange)="onMetodoChange()"
          [disabled]="salvando() || carregandoOpcoes()"
        >
          <option value="" disabled>Selecione…</option>
          @for (m of metodos; track m) {
            <option [value]="m">{{ m }}</option>
          }
        </select>
      </label>
      <label class="fin-edit-field">
        <span class="fin-edit-field__label">Conta</span>
        <select
          class="fin-edit-field__select"
          [(ngModel)]="conta"
          [disabled]="salvando() || carregandoOpcoes()"
        >
          <option value="Caixa">Caixa</option>
          <option value="Banco">Banco</option>
        </select>
      </label>
    </div>

    <div class="fin-edit-grid fin-edit-grid--3">
      @if (linha()?.linhaReceita) {
        <label class="fin-edit-field">
          <span class="fin-edit-field__label">Recebido de</span>
          <select
            class="fin-edit-field__select"
            [(ngModel)]="clienteId"
            [disabled]="salvando() || carregandoOpcoes()"
          >
            <option value="">—</option>
            @for (c of clientes(); track c.id) {
              <option [value]="c.id">{{ c.nome }}</option>
            }
          </select>
        </label>
      }
      <label class="fin-edit-field">
        <span class="fin-edit-field__label">Categoria</span>
        <select
          class="fin-edit-field__select"
          [(ngModel)]="categoriaId"
          [disabled]="salvando() || carregandoOpcoes()"
        >
          <option [ngValue]="null" disabled>Selecione…</option>
          @for (c of categoriasFiltradas; track c.id) {
            <option [ngValue]="c.id">{{ c.nome }}</option>
          }
        </select>
      </label>
      <label class="fin-edit-field">
        <span class="fin-edit-field__label">Baixa</span>
        <span class="fin-edit-date-wrap">
          <button
            type="button"
            class="fin-edit-date-btn"
            [class.fin-edit-date-btn--placeholder]="dataPlaceholder(dataBaixaYmd)"
            (click)="abrirCalendarioData($event, baixaInput)"
            [disabled]="salvando() || carregandoOpcoes()"
          >
            {{ rotuloData(dataBaixaYmd) }}
          </button>
          <input
            #baixaInput
            type="date"
            class="fin-edit-date-native"
            [value]="dataBaixaYmd"
            tabindex="-1"
            aria-hidden="true"
            (change)="onDataAlterada($event, 'baixa')"
          />
        </span>
      </label>
    </div>

    <label class="fin-edit-toggle-row fin-edit-toggle-row--compact">
      <span class="fin-edit-toggle-row__label">Ajustar data de competência</span>
      <button
        type="button"
        class="drawer-switch"
        [class.drawer-switch--on]="ajustarCompetencia"
        [attr.aria-pressed]="ajustarCompetencia"
        (click)="ajustarCompetencia = !ajustarCompetencia"
        [disabled]="salvando() || carregandoOpcoes()"
      ></button>
    </label>
  </div>

  <footer class="fin-edit-footer">
    <button
      type="button"
      class="fin-edit-footer__btn fin-edit-footer__btn--primary"
      (click)="submit()"
      [disabled]="salvando() || carregandoOpcoes()"
    >
      {{ salvando() ? 'A guardar…' : 'Salvar' }}
    </button>
  </footer>
</div>
