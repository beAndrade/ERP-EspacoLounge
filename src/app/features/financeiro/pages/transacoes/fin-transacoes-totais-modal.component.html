@if (aberto()) {
  <div
    class="overlay fin-trans-totais-modal-overlay"
    [class.overlay--open]="aberto()"
    role="presentation"
    (click)="onOverlayClick($event)"
  ></div>

  <div
    class="fin-trans-totais-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="fin-trans-totais-modal-title"
    (click)="$event.stopPropagation()"
  >
    <header class="fin-trans-totais-modal__head">
      <h2 id="fin-trans-totais-modal-title" class="fin-trans-totais-modal__title">
        Totais
      </h2>
      <button
        type="button"
        class="fin-trans-totais-modal__close"
        (click)="fechar.emit()"
        aria-label="Fechar"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    <p class="fin-trans-totais-modal__meta">
      {{ resumo().quantidadeLinhas }} linha{{
        resumo().quantidadeLinhas === 1 ? '' : 's'
      }}
      no filtro atual
    </p>

    <ul class="fin-trans-totais-modal__grid">
      @for (card of cards; track card.id) {
        <li>
          <div
            class="fin-trans-totais-modal__card"
            [class.fin-trans-totais-modal__card--recebidos]="
              card.tema === 'recebidos'
            "
            [class.fin-trans-totais-modal__card--a-receber]="
              card.tema === 'a-receber'
            "
            [class.fin-trans-totais-modal__card--pagos]="card.tema === 'pagos'"
            [class.fin-trans-totais-modal__card--a-pagar]="card.tema === 'a-pagar'"
          >
            <span class="fin-trans-totais-modal__card-label">{{ card.titulo }}</span>
            <span class="fin-trans-totais-modal__card-value">{{
              valorCard(card.id) | currency: 'BRL' : 'symbol' : '1.2-2'
            }}</span>
          </div>
        </li>
      }
    </ul>
  </div>
}
