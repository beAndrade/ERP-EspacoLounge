<div
  class="fin-fluxo"
  [class.fin-fluxo--animated]="animated() && hasData()"
  [class.fin-fluxo--empty]="!hasData()"
>
  <div #plot class="fin-fluxo__plot">
    <svg
      class="fin-fluxo__svg"
      [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
      preserveAspectRatio="none"
      role="img"
      aria-label="Gráfico de fluxo de caixa"
      (mousemove)="onMove($event)"
      (mouseleave)="onLeave()"
    >
      <defs>
        <linearGradient id="finFluxoAreaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
          <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02" />
        </linearGradient>
      </defs>

      <!-- Grid horizontal pontilhado -->
      @for (g of gridLines(); track g.value) {
        <line
          class="fin-fluxo__grid fin-fluxo__grid--h"
          [attr.x1]="pad.l"
          [attr.x2]="width() - pad.r"
          [attr.y1]="g.y"
          [attr.y2]="g.y"
        />
        <text
          class="fin-fluxo__tick"
          [attr.x]="pad.l - 8"
          [attr.y]="g.y + 3"
          text-anchor="end"
        >
          {{ g.label }}
        </text>
      }

      <!-- Grid vertical pontilhado -->
      @for (v of verticalGrid(); track v.x) {
        <line
          class="fin-fluxo__grid fin-fluxo__grid--v"
          [attr.x1]="v.x"
          [attr.x2]="v.x"
          [attr.y1]="pad.t"
          [attr.y2]="geom().plotBottom"
        />
      }

      @if (hasData()) {
        <!-- Barras -->
        <g class="fin-fluxo__bars">
          @for (b of geom().bars; track trackYmd($index, b)) {
            <g
              class="fin-fluxo__col"
              [class.fin-fluxo__col--dim]="isDimmed(b.ymd)"
              [class.fin-fluxo__col--active]="effectiveDay() === b.ymd"
            >
              @if (b.hEntrada > 0) {
                <rect
                  class="fin-fluxo__bar fin-fluxo__bar--entrada"
                  [attr.x]="b.xEntrada"
                  [attr.y]="b.yEntrada"
                  [attr.width]="b.w"
                  [attr.height]="b.hEntrada"
                  rx="4"
                  ry="4"
                />
              }
              @if (b.hSaida > 0) {
                <rect
                  class="fin-fluxo__bar fin-fluxo__bar--saida"
                  [attr.x]="b.xSaida"
                  [attr.y]="b.ySaida"
                  [attr.width]="b.w"
                  [attr.height]="b.hSaida"
                  rx="4"
                  ry="4"
                />
              }
            </g>
          }
        </g>

        <!-- Área + linha saldo -->
        <g
          class="fin-fluxo__line-wrap"
          [class.fin-fluxo__line-wrap--dim]="!!effectiveDay()"
        >
          <path
            class="fin-fluxo__area"
            [attr.d]="areaPath()"
            fill="url(#finFluxoAreaGrad)"
          />
          <path
            class="fin-fluxo__line"
            [attr.d]="linePath()"
            fill="none"
            stroke="#3b82f6"
            stroke-width="2.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>

      } @else if (zeroLineY() != null) {
        <!-- Linha de saldo em zero quando não há movimentação -->
        <line
          class="fin-fluxo__zero-line"
          [attr.x1]="pad.l"
          [attr.x2]="width() - pad.r"
          [attr.y1]="zeroLineY()"
          [attr.y2]="zeroLineY()"
        />
      }

      <!-- Crosshair sólido + marcador na base (com ou sem movimentação) -->
      @if (crosshairX() != null) {
        <line
          class="fin-fluxo__crosshair"
          [attr.x1]="crosshairX()"
          [attr.x2]="crosshairX()"
          [attr.y1]="pad.t"
          [attr.y2]="geom().plotBottom"
        />
        <circle
          class="fin-fluxo__marker"
          [attr.cx]="crosshairX()"
          [attr.cy]="geom().plotBottom"
          r="5"
        />
      }

      <!-- Labels X -->
      @for (xl of xLabels(); track xl.x) {
        <text
          class="fin-fluxo__xlabel"
          [attr.x]="xl.x"
          [attr.y]="height() - 10"
          text-anchor="middle"
        >
          {{ xl.label }}
        </text>
      }
    </svg>
  </div>

  <ul class="fin-fluxo__legend" aria-hidden="true">
    <li class="fin-fluxo__chip">
      <span class="fin-fluxo__sq fin-fluxo__sq--entrada"></span> Entrada
    </li>
    <li class="fin-fluxo__chip">
      <span class="fin-fluxo__sq fin-fluxo__sq--saida"></span> Saída
    </li>
    <li class="fin-fluxo__chip">
      <span class="fin-fluxo__line-swatch"></span> Saldo acumulado
    </li>
  </ul>

  <app-fin-painel-chart-tooltip />
</div>
