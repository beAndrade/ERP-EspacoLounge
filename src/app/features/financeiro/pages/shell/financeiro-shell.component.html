@if (!adminPin.unlocked()) {
  <div class="pin-page">
    <div class="pin-card">
      <div class="pin-card__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.5 10.5V7.5a4.5 4.5 0 10-9 0v3m-.75 11.25h10.5A2.25 2.25 0 0019.5 19.5v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
          />
        </svg>
      </div>
      <h1 class="pin-card__title">Financeiro protegido</h1>
      <p class="pin-card__subtitle">
        Digite o PIN para ver painel, transações e comissões. Ao terminar, use
        Bloquear.
      </p>

      <form class="pin-form" (ngSubmit)="entrar()">
        <label class="pin-field">
          <span class="pin-field__label">PIN</span>
          <input
            class="pin-field__input"
            type="password"
            name="adminPin"
            [(ngModel)]="pinDraft"
            autocomplete="off"
            inputmode="numeric"
            placeholder="••••"
            [disabled]="verificando"
          />
        </label>

        @if (erroPin) {
          <p class="pin-form__erro" role="alert">{{ erroPin }}</p>
        }

        <button
          type="submit"
          class="pin-form__submit"
          [disabled]="verificando"
        >
          {{ verificando ? 'Verificando…' : 'Desbloquear' }}
        </button>
      </form>
    </div>
  </div>
} @else {
  <div
    class="financeiro-outlet"
    [class.financeiro-outlet--layout-proprio]="layoutProprio"
  >
    <router-outlet />
  </div>
}
