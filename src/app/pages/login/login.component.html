<div class="login-page">
  <div class="login-card">
    <h1 class="login-card__title">Espaço Lounge</h1>
    <p class="login-card__subtitle">
      Entre com seu e-mail e senha para acessar o sistema.
    </p>

    <form class="login-form" (ngSubmit)="entrar()">
      <label class="login-field">
        <span class="login-field__label">E-mail</span>
        <input
          class="login-field__input"
          type="email"
          name="email"
          autocomplete="username"
          [(ngModel)]="email"
          [disabled]="carregando"
          required
        />
      </label>

      <label class="login-field">
        <span class="login-field__label">Senha</span>
        <div class="login-field__senha-wrap">
          <input
            class="login-field__input"
            [type]="mostrarSenha ? 'text' : 'password'"
            name="senha"
            autocomplete="current-password"
            [(ngModel)]="senha"
            [disabled]="carregando"
            required
          />
          <button
            type="button"
            class="login-field__toggle"
            (click)="mostrarSenha = !mostrarSenha"
            [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
          >
            {{ mostrarSenha ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </label>

      @if (erro) {
        <p class="login-form__erro" role="alert">{{ erro }}</p>
      }

      <button
        type="submit"
        class="login-form__submit"
        [disabled]="carregando"
      >
        {{ carregando ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>

@if (modalSessaoExpirada) {
  <div
    class="comandas-modal-overlay"
    aria-hidden="true"
    (click)="fecharModalSessaoExpirada()"
  ></div>
  <div
    class="comandas-modal login-sessao-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="login-sessao-modal-title"
    (click)="$event.stopPropagation()"
  >
    <div class="comandas-modal__icon-wrap" aria-hidden="true">
      <span class="comandas-modal__icon">!</span>
    </div>
    <h2 id="login-sessao-modal-title" class="comandas-modal__title login-sessao-modal__title">
      Acesso expirado
    </h2>
    <p class="comandas-modal__text login-sessao-modal__text">
      Sua sessão expirou por segurança. Informe novamente seu e-mail e senha
      para continuar.
    </p>
    <div class="login-sessao-modal__actions">
      <button
        type="button"
        class="login-sessao-modal__btn"
        (click)="fecharModalSessaoExpirada()"
      >
        Entendi
      </button>
    </div>
  </div>
}
