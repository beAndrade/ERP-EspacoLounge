<div
  class="shell"
  [ngClass]="{ 'shell--sidebar-collapsed': sidebarCollapsed }"
>
  <aside class="app-sidebar" aria-label="Menu lateral">
    <div class="app-sidebar__header">
      <a
        routerLink="/agenda"
        class="brand"
        [attr.aria-label]="'Ir para a Agenda — ' + title"
        >{{ title }}</a
      >
      <button
        type="button"
        class="sidebar-toggle"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="!sidebarCollapsed"
        aria-controls="app-sidebar-nav"
        [attr.aria-label]="
          sidebarCollapsed ? 'Expandir menu lateral' : 'Recolher menu lateral'
        "
      >
        @if (sidebarCollapsed) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="sidebar-toggle__icon"
            aria-hidden="true"
          >
            <path d="M21 5H11" />
            <path d="M21 12H11" />
            <path d="M21 19H11" />
            <path d="m3 8 4 4-4 4" />
          </svg>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="sidebar-toggle__icon"
            aria-hidden="true"
          >
            <path d="M21 5H11" />
            <path d="M21 12H11" />
            <path d="M21 19H11" />
            <path d="m7 8-4 4 4 4" />
          </svg>
        }
      </button>
    </div>
    <div class="app-sidebar__divider" role="presentation" aria-hidden="true"></div>
    <nav
      id="app-sidebar-nav"
      class="nav nav--sidebar"
      aria-label="Navegação da aplicação"
    >
      <div
        class="nav-group"
        [class.nav-group--open]="principalExpanded"
      >
        <button
          type="button"
          class="nav-group__head"
          [attr.aria-expanded]="principalExpanded"
          (click)="togglePrincipal()"
        >
          <svg
            class="nav-group__head-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"
            />
            <path
              d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
            />
          </svg>
          <span class="nav-group__head-label">Principal</span>
          <svg
            class="nav-group__chevron"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m19.5 8.25-7.5 7.5-7.5-7.5"
            />
          </svg>
        </button>

        <ul class="nav-group__sub" role="list">
          <li>
            <a
              routerLink="/painel"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-item nav-item--sub"
              aria-label="Painel"
              title="Painel"
            >
              <svg
                class="nav-item__icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m12 14 4-4" />
                <path d="M3.34 19a10 10 0 1 1 17.32 0" />
              </svg>
              <span class="nav-item__label">Painel</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/agenda"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: false }"
              class="nav-item nav-item--sub"
              aria-label="Agenda"
              title="Agenda"
            >
              <svg
                class="nav-item__icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M8 2v4" />
                <path d="M16 2v4" />
                <rect width="18" height="18" x="3" y="4" rx="2" />
                <path d="M3 10h18" />
              </svg>
              <span class="nav-item__label">Agenda</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/comandas"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: false }"
              class="nav-item nav-item--sub"
              aria-label="Comandas"
              title="Comandas"
            >
              <svg
                class="nav-item__icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M8 2v4" />
                <path d="M12 2v4" />
                <path d="M16 2v4" />
                <rect width="16" height="18" x="4" y="4" rx="2" />
                <path d="M8 10h6" />
                <path d="M8 14h8" />
                <path d="M8 18h5" />
              </svg>
              <span class="nav-item__label">Comandas</span>
            </a>
          </li>
          <li>
            <a
              routerLink="/pacotes"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-item nav-item--sub"
              aria-label="Pacotes"
              title="Pacotes"
            >
              <svg
                class="nav-item__icon"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M10 22V7a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5a1 1 0 0 0-1-1H2"
                />
                <rect x="14" y="2" width="8" height="8" rx="1" />
              </svg>
              <span class="nav-item__label">Pacotes</span>
            </a>
          </li>
        </ul>
      </div>

      <a
        routerLink="/financeiro"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-item"
        aria-label="Financeiro"
        title="Financeiro"
      >
        <svg
          class="nav-item__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
          <path d="M12 18V6" />
        </svg>
        <span class="nav-item__label">Financeiro</span>
      </a>
      <a
        routerLink="/estoque"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Estoque"
        title="Estoque"
      >
        <svg
          class="nav-item__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 17v4" />
          <path d="M8 21h8" />
          <path d="m9 17 6.1-6.1a2 2 0 0 1 2.81.01L22 15" />
          <circle cx="8" cy="9" r="2" />
          <rect x="2" y="3" width="20" height="14" rx="2" />
        </svg>
        <span class="nav-item__label">Estoque</span>
      </a>
      <a
        routerLink="/clientes"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Clientes"
        title="Clientes"
      >
        <svg
          class="nav-item__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <path d="M16 3.128a4 4 0 0 1 0 7.744" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <circle cx="9" cy="7" r="4" />
        </svg>
        <span class="nav-item__label">Clientes</span>
      </a>
      <a
        routerLink="/promocoes"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Promoções"
        title="Promoções"
      >
        <svg
          class="nav-item__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M13.172 2a2 2 0 0 1 1.414.586l6.71 6.71a2.4 2.4 0 0 1 0 3.408l-4.592 4.592a2.4 2.4 0 0 1-3.408 0l-6.71-6.71A2 2 0 0 1 6 9.172V3a1 1 0 0 1 1-1z"
          />
          <path
            d="M2 7v6.172a2 2 0 0 0 .586 1.414l6.71 6.71a2.4 2.4 0 0 0 3.191.193"
          />
          <circle cx="10.5" cy="6.5" r=".5" fill="currentColor" />
        </svg>
        <span class="nav-item__label">Promoções</span>
      </a>
      <a
        routerLink="/relatorios"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Relatórios"
        title="Relatórios"
      >
        <svg
          class="nav-item__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"
          />
          <path d="M21.21 15.89A10 10 0 1 1 8 2.83" />
        </svg>
        <span class="nav-item__label">Relatórios</span>
      </a>
      <a
        routerLink="/profissionais"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Profissionais"
        title="Profissionais"
      >
        <svg
          class="nav-item__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 21a6 6 0 0 0-12 0" />
          <circle cx="12" cy="11" r="4" />
          <rect width="18" height="18" x="3" y="3" rx="2" />
        </svg>
        <span class="nav-item__label">Profissionais</span>
      </a>
      <a
        routerLink="/configuracoes"
        routerLinkActive="active"
        class="nav-item"
        aria-label="Configurações"
        title="Configurações"
      >
        <svg
          class="nav-item__icon"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M11 10.27 7 3.34" />
          <path d="m11 13.73-4 6.93" />
          <path d="M12 22v-2" />
          <path d="M12 2v2" />
          <path d="M14 12h8" />
          <path d="m17 20.66-1-1.73" />
          <path d="m17 3.34-1 1.73" />
          <path d="M2 12h2" />
          <path d="m20.66 17-1.73-1" />
          <path d="m20.66 7-1.73 1" />
          <path d="m3.34 17 1.73-1" />
          <path d="m3.34 7 1.73 1" />
          <circle cx="12" cy="12" r="2" />
          <circle cx="12" cy="12" r="8" />
        </svg>
        <span class="nav-item__label">Configurações</span>
      </a>
    </nav>
  </aside>

  <div class="app-main-column">
    <main class="main">
      <router-outlet />
    </main>
  </div>
</div>
