# Template processado pelo entrypoint oficial do nginx (envsubst).
# Copiado para /etc/nginx/templates/default.conf.template no Dockerfile.
# ${API_HOST} → nome DNS do serviço API (default: api).

# DNS embutido do Docker — resolve o upstream em cada pedido (não no arranque).
# Evita: host not found in upstream "api" quando a API ainda não está no DNS.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Variável obriga resolução em runtime (proxy_pass estático resolve no start).
    set $api_upstream ${API_HOST};

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Com variável, incluir $request_uri — senão o path pode ser perdido.
        proxy_pass http://$api_upstream:3000$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://$api_upstream:3000/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
}
