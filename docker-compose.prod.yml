# Exemplo de stack para produção (VPS). Ajuste variáveis e domínio.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: espaco_lounge
    volumes:
      - espaco_lounge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/espaco_lounge
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_PIN: ${ADMIN_PIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://SEU_DOMINIO"]}
    ports:
      - '3000:3000'

  # Opcional: servir o build Angular estático (substitua dist pela sua URL de hosting)
  # web:
  #   image: nginx:alpine
  #   volumes:
  #     - ./dist/espaco-lounge/browser:/usr/share/nginx/html:ro
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   ports:
  #     - '80:80'

volumes:
  espaco_lounge_pg:
