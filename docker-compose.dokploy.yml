# Stack completa para Dokploy (ERP + WhatsApp Evolution).
# Postgres do ERP = serviço Dokploy externo: espacoloungedb-etzdoz
# (não usa o serviço "db" neste ficheiro).
#
# Environment: POSTGRES_PASSWORD, JWT_SECRET, EVOLUTION_*, CORS_ORIGINS, etc.
# Domínios: web → app… ; evolution-api → evolution… (opcional)

services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      # Hostname fixo do Postgres Dokploy (menu Docker / Internal Host).
      DB_HOST: ${DB_HOST:-espacoloungedb-etzdoz}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-espacolounge}
      DB_NAME: ${DB_NAME:-espacolounge}
      PORT: 3000
      NODE_ENV: production
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      ADMIN_PROFISSIONAL_NOME: ${ADMIN_PROFISSIONAL_NOME:-}
      ADMIN_PIN: ${ADMIN_PIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://app.espacolounge.com.br"]}
    expose:
      - '3000'
    networks:
      espaco-internal:
        aliases:
          - api
          - espaco-lounge-api
      dokploy-network:
        aliases:
          - api
          - espaco-lounge-api

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Host DNS da API para o nginx (rede espaco-internal / aliases acima).
      API_HOST: ${API_HOST:-api}
    expose:
      - '80'
    networks:
      - dokploy-network
      - espaco-internal

  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - listen_addresses=*
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - espaco-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - espaco-internal

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      evolution-redis:
        condition: service_started
      evolution-postgres:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-https://evolution.seudominio.com.br}
      SERVER_PORT: 8080
      SERVER_TYPE: http
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution_espaco_lounge
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'
      DATABASE_SAVE_DATA_LABELS: 'true'
      DATABASE_SAVE_DATA_HISTORIC: 'true'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution_espaco
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      CONFIG_SESSION_PHONE_CLIENT: ${EVOLUTION_SESSION_CLIENT:-Espaco Lounge}
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: 'false'
      QRCODE_LIMIT: '30'
      LOG_LEVEL: ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      LOG_COLOR: 'true'
      LOG_BAILEYS: error
    expose:
      - '8080'
    networks:
      - espaco-internal
      - dokploy-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  evolution-manager:
    image: evoapicloud/evolution-manager:latest
    profiles: ['manager']
    restart: unless-stopped
    depends_on:
      evolution-api:
        condition: service_started
    expose:
      - '80'
    networks:
      - espaco-internal
      - dokploy-network

volumes:
  evolution_postgres:
  evolution_redis:
  evolution_instances:
  evolution_store:

networks:
  # DNS interno: api ↔ web ↔ evolution-*
  espaco-internal:
    driver: bridge
  # Traefik + Postgres Dokploy (espacoloungedb-etzdoz)
  dokploy-network:
    external: true
